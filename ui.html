label {

  font-weight: 500;
  color: #333;
}

  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 11px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

}

}

.button {

  background: #18A0FB;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s;
}

.button:hover {
  background: #1591E8;
}

.button:active {
  background: #0D7AC7;
}

.button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.message {

  border-radius: 8px;
  font-size: 11px;
  display: none;
}

.message.show {

}

.message.success {

  color: #2E7D32;
  border: 1px solid #A5D6A7;
}

.message.error {

  color: #C62828;
  border: 1px solid #EF9A9A;
}

.history-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-list {
  max-height: 326px;
  overflow-y: auto;
  border-radius: 8px;
  background: #f0f0f0;
}

.history-item {

  cursor: pointer;
  font-size: 11px;
  border-bottom: 1px solid #fff;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: relative;
}

.history-item.hidden {
  display: none;
}

.history-item:last-child {
  border-bottom: none;
}

.history-item:hover {
  background: rgba(0, 0, 0, 0.05);
}

.history-item:active {
  background: #e8e8e8;
}

.history-item-domain {
  flex: 1;
}

.delete-btn {
  opacity: 0;
  width: 36px;
  height: 36px;
  border: none;
  background: none;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #999;
  transition: opacity 0.2s, color 0.2s;
  font-size: 20px;
  line-height: 1;
  border-radius: 8px 0px 0px 8px;
  font-weight: 400;
}

.history-item:hover .delete-btn {
  opacity: 1;
}

.delete-btn:hover {
  color: #000;
  background: rgba(0, 0, 0, 0.05);
}

.history-empty {
  padding: 16px;
  text-align: center;
  color: #999;
  font-size: 11px;
}

.size-selector {
  display: inline-flex;
  background: #f0f0f0;
  border-radius: 8px;
  padding: 2px;
  gap: 0;
}

.size-option {

  cursor: pointer;
  font-size: 11px;
  color: #333;
  border-radius: 6px;
  transition: all 0.2s;
  border: none;
  background: transparent;
  font-family: inherit;
  font-weight: 500;
}

.size-option.active {

  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  color: #000;
}

.size-option:hover:not(.active) {
  background: rgba(0, 0, 0, 0.05);
}

  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  color: #aaa;
  padding-top: 8px;
  padding-bottom: 16px;
  font-size: 11px;
}

  </style>
