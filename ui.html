<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 20px;
    }
    
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
    }
    
    .input-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
    }
    
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    button {
      background-color: #18A0FB;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    
    button:hover {
      background-color: #0D8DE3;
    }
    
    .error {
      color: #EB5757;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    
    .loading {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h2>Favicon Grabber</h2>
  
  <div class="input-group">
    <label for="domain">Enter domain (e.g. shopname.com)</label>
    <input id="domain" type="text" placeholder="shopname.com" />
    <div id="error-message" class="error">Please enter a valid domain</div>
  </div>
  
  <button id="grab-btn">Grab Favicon</button>
  <div id="loading" class="loading">Downloading favicon...</div>
  
  <script>
    document.getElementById('grab-btn').onclick = () => {
      const domain = document.getElementById('domain').value.trim();
      const errorElement = document.getElementById('error-message');
      
      if (!domain) {
        errorElement.style.display = 'block';
        return;
      }
      
      errorElement.style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      
      // Send domain to the plugin code
      parent.postMessage({ pluginMessage: { type: 'grab-favicon', domain } }, '*');
    };
    
    // Listen for messages from the plugin code
    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      
      if (message.type === 'error') {
        document.getElementById('error-message').textContent = message.message;
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
      } else if (message.type === 'success') {
        document.getElementById('loading').style.display = 'none';
      }
    };
  </script>
</body>
</html>
