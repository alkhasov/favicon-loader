<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Favicon Loader</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  font-size: 11px;
  background: #ffffff;
  color: #333;
  padding: 16px;
  padding-bottom: 40px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}

h2 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  color: #000;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.actions-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

label {
  font-size: 11px;
  font-weight: 500;
  color: #333;
}

input[type="text"] {
  width: 100%;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 11px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

input[type="text"]:focus {
  border-color: #18A0FB;
}

input[type="text"]::placeholder {
  color: #999;
}

.button {
  flex: 1;
  padding: 8px 16px;
  background: #18A0FB;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s;
}

.button:hover {
  background: #1591E8;
}

.button:active {
  background: #0D7AC7;
}

.button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.message {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 11px;
  display: none;
}

.message.show {
  display: block;
}

.message.success {
  background: #E8F5E9;
  color: #2E7D32;
  border: 1px solid #A5D6A7;
}

.message.error {
  background: #FFEBEE;
  color: #C62828;
  border: 1px solid #EF9A9A;
}

.history-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-list {
  max-height: 326px;
  overflow-y: auto;
  border-radius: 8px;
  background: #f0f0f0;
}

.history-item {
  padding: 0px 0px 0px 12px;
  cursor: pointer;
  font-size: 11px;
  border-bottom: 1px solid #fff;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: relative;
}

.history-item.hidden {
  display: none;
}

.history-item:last-child {
  border-bottom: none;
}

.history-item:hover {
  background: rgba(0, 0, 0, 0.05);
}

.history-item:active {
  background: #e8e8e8;
}

.history-item-domain {
  flex: 1;
}

.delete-btn {
  opacity: 0;
  width: 36px;
  height: 36px;
  border: none;
  background: none;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #999;
  transition: opacity 0.2s, color 0.2s;
  font-size: 20px;
  line-height: 1;
  border-radius: 8px 0px 0px 8px;
  font-weight: 400;
}

.history-item:hover .delete-btn {
  opacity: 1;
}

.delete-btn:hover {
  color: #000;
  background: rgba(0, 0, 0, 0.05);
}

.history-empty {
  padding: 16px;
  text-align: center;
  color: #999;
  font-size: 11px;
}

.size-selector {
  display: inline-flex;
  background: #f0f0f0;
  border-radius: 8px;
  padding: 2px;
  gap: 0;
}

.size-option {
  padding: 6px 16px;
  cursor: pointer;
  font-size: 11px;
  color: #333;
  border-radius: 6px;
  transition: all 0.2s;
  border: none;
  background: transparent;
  font-family: inherit;
  font-weight: 500;
}

.size-option.active {
  background: #ffffff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  color: #000;
}

.size-option:hover:not(.active) {
  background: rgba(0, 0, 0, 0.05);
}

.version-footer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  color: #aaa;
  padding-top: 8px;
  padding-bottom: 16px;
  font-size: 11px;
}

.footer-link {
  color: #aaa;
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}

.footer-link:hover {
  color: #000;
}

.footer-separator {
  color: #aaa;
}

.footer-version {
  color: #aaa;
}

/* App Root */
.app-root {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Switcher Component */
.switcher {
  position: relative;
  width: 53px;
  height: 21px;
  background: #f0f0f0;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background 0.2s;
  flex-shrink: 0;
}

.switcher:hover {
  background: #e8e8e8;
}

.switcher.active {
  background: #4A9EF4;
}

.switcher.active:hover {
  background: #3d8ce0;
}

.switcher.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.switcher-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 25px;
  height: 17px;
  background: white;
  border-radius: 6px;
  transition: left 0.2s;
}

.switcher.active .switcher-knob {
  left: 26px;
}

/* Settings Page */
.settings-page {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.settings-title {
  font-size: 16px;
  font-weight: 700;
  color: #000;
  margin-bottom: 8px;
}

.settings-list {
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* Settings Item */
.settings-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  min-height: 47px;
  padding: 12px 0;
  border-top: 1px solid rgba(0, 0, 0, 0.1);
  gap: 12px;
}

.settings-item:first-child {
  border-top: 1px solid rgba(0, 0, 0, 0.1);
}

.settings-item-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 1px;
}

.settings-item-title {
  font-size: 11px;
  font-weight: 500;
  color: #000;
  line-height: 13px;
}

.settings-item-description {
  font-size: 11px;
  font-weight: 400;
  color: #000;
  opacity: 0.3;
  line-height: 13px;
}

.settings-item-control {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

/* Settings Button Container */
.settings-button-container {
  margin-top: auto;
  padding-top: 16px;
}

.settings-button-container .button {
  width: 100%;
}

  </style>
</head>
